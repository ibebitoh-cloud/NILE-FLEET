
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nile Fleet</title>
    <meta name="description" content="Premium Clip-On Genset Management Platform">
    <meta property="og:title" content="Nile Fleet">
    <meta property="og:description" content="Premium Clip-On Genset Management Platform">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/nile-fleet-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --text-primary: #26231f;
            --text-secondary: #5f5a52;
            --border-primary: #d8d2c8;
            --card-bg: #faf9f6;
            --accent: #9b7438;
            --input-bg: #ffffff;
            --app-scale: 1;
        }

        html {
            font-size: 16px;
            min-width: 320px;
        }

        body { 
            font-family: 'Inter', 'Noto Sans Arabic', 'Tajawal', 'Cairo', 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.4s ease, color 0.4s ease;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            --rail-bg: var(--bg-primary);
            --row-bg: var(--card-bg);
        }
        
        /* Dynamic table row backgrounds */
        table tbody tr:not(.selected-row) td {
            background-color: var(--row-bg) !important;
            transition: background-color 0.2s ease;
        }
        table tbody tr:not(.selected-row):hover td {
            filter: brightness(0.95);
        }
        body.theme-night table tbody tr:not(.selected-row):hover td {
            filter: none;
            background-color: var(--surface-2, var(--input-bg)) !important;
        }
        
        [dir="rtl"] {
            font-family: 'Noto Sans Arabic', 'Tajawal', 'Cairo', 'Arial', sans-serif;
        }

        /* Arabic typography guardrails.
           Arabic script must use the browser's native shaping/ligatures.
           Positive letter-spacing is explicitly forbidden for Arabic because it
           can make connected glyphs look visually disconnected. */
        .nf-arabic-text,
        [lang="ar"].nf-arabic-text,
        [dir="rtl"].nf-arabic-text {
            font-family: 'Noto Sans Arabic', 'Tajawal', 'Cairo', 'Arial', sans-serif !important;
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: normal !important;
            word-spacing: normal;
            text-transform: none !important;
            font-kerning: normal;
            font-variant-ligatures: common-ligatures contextual;
            font-feature-settings: "rlig" 1, "calt" 1, "liga" 1;
            word-break: normal;
            overflow-wrap: anywhere;
            unicode-bidi: plaintext;
            text-align: start;
        }

        /* Arabic shaping guard — connected Arabic letters must never be
           separated by inherited Tailwind tracking or component styles. */
        [dir="rtl"] *,
        [lang="ar"] * {
            letter-spacing: normal !important;
            word-spacing: normal !important;
            text-transform: none;
        }

        [dir="rtl"] [class*="tracking-"],
        [lang="ar"] [class*="tracking-"] {
            letter-spacing: normal !important;
        }

        /* Tailwind tracking utilities are useful for Latin UI chrome but are
           not appropriate for Arabic words. The auto-marked class above wins
           over every tracking utility without changing English typography. */
        .nf-arabic-text[class*="tracking-"] {
            letter-spacing: normal !important;
        }

        input.nf-arabic-text,
        textarea.nf-arabic-text,
        select.nf-arabic-text {
            text-align: right;
            direction: rtl;
            unicode-bidi: plaintext;
        }

        .nf-ltr-isolate {
            direction: ltr !important;
            unicode-bidi: isolate;
            text-align: left;
            letter-spacing: normal;
        }

        /* SYSTEM-WIDE RTL LAYOUT
           Arabic mode is a true interface direction, not only translated words.
           Components can opt out with .nf-ltr-isolate for IDs, codes and values. */
        [dir="rtl"] body,
        html[dir="rtl"] body {
            direction: rtl;
            text-align: start;
        }

        [dir="rtl"] button,
        [dir="rtl"] input,
        [dir="rtl"] textarea,
        [dir="rtl"] select {
            font-family: 'Noto Sans Arabic', 'Tajawal', 'Cairo', 'Arial', sans-serif;
        }

        [dir="rtl"] input::placeholder,
        [dir="rtl"] textarea::placeholder {
            text-align: right;
            direction: rtl;
        }

        [dir="rtl"] table {
            direction: rtl;
        }

        [dir="rtl"] th,
        [dir="rtl"] td {
            text-align: start;
        }

        /* Keep operational identifiers readable in their natural LTR order. */
        [dir="rtl"] .nf-ltr-isolate,
        [dir="rtl"] [data-ltr] {
            direction: ltr !important;
            unicode-bidi: isolate;
            text-align: left !important;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* Arabic UI must never inherit Latin uppercase styling or tracking. */
        [dir="rtl"] .uppercase,
        [dir="rtl"] [class*="tracking-"] {
            text-transform: none;
        }

        /* Prevent flex rows from looking visually reversed twice. Components
           explicitly using flex-row-reverse keep their intended semantic order. */
        [dir="rtl"] .nf-arabic-row {
            direction: rtl;
        }

        /* NILE FLEET — TWO ENVIRONMENTS ONLY: DAY / NIGHT */
        body.theme-day {
            --bg-primary: #f3f1ec;
            --text-primary: #26231f;
            --text-secondary: #5f5a52;
            --border-primary: #d8d2c8;
            --card-bg: #faf9f6;
            --accent: #9b7438;
            --input-bg: #ffffff;
            --rail-bg: #e9e5de;
            --row-bg: #faf9f6;
            --surface-0: #f3f1ec;
            --surface-1: #faf9f6;
            --surface-2: #f1eee8;
            --surface-3: #e8e3da;
        }

        body.theme-night {
            --bg-primary: #050b14;
            --text-primary: #ffffff;
            --text-secondary: #d1dbe5;
            --border-primary: #34485d;
            --card-bg: #0d1928;
            --accent: #d0ae78;
            --input-bg: #0a1421;
            --rail-bg: #050d16;
            --row-bg: #0d1927;
            --surface-0: #050b14;
            --surface-1: #0d1928;
            --surface-2: #0a1421;
            --surface-3: #111f30;
        }

        body[class*="theme-"] {
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        /* Core surfaces. Components can still use Tailwind classes; these rules
           normalize only structural neutrals so Day and Night stay consistent. */
        body.theme-day .bg-white,
        body.theme-day .bg-slate-50,
        body.theme-day .bg-slate-100,
        body.theme-day .bg-gray-50,
        body.theme-day .bg-gray-100,
        body.theme-day .bg-neutral-50,
        body.theme-day .bg-neutral-100 {
            background-color: var(--surface-1) !important;
            color: var(--text-primary) !important;
        }

        body.theme-night .bg-white,
        body.theme-night .bg-slate-50,
        body.theme-night .bg-slate-100,
        body.theme-night .bg-gray-50,
        body.theme-night .bg-gray-100,
        body.theme-night .bg-neutral-50,
        body.theme-night .bg-neutral-100 {
            background-color: var(--surface-1) !important;
            color: var(--text-primary) !important;
        }

        body.theme-day .bg-slate-900 { background-color: #3a3833 !important; }
        body.theme-day .bg-slate-800 { background-color: #4b4841 !important; }
        body.theme-night .bg-slate-900 { background-color: var(--surface-1) !important; }
        body.theme-night .bg-slate-800 { background-color: var(--surface-2) !important; }

        /* Text hierarchy — never leave muted Tailwind gray text unreadable. */
        body.theme-day .text-slate-900,
        body.theme-day .text-slate-800,
        body.theme-day .text-slate-700,
        body.theme-day .text-gray-900,
        body.theme-day .text-gray-800,
        body.theme-day .text-gray-700,
        body.theme-day .text-neutral-900,
        body.theme-day .text-neutral-800,
        body.theme-day .text-neutral-700 { color: #26231f !important; }

        body.theme-day .text-slate-600,
        body.theme-day .text-slate-500,
        body.theme-day .text-slate-400,
        body.theme-day .text-gray-600,
        body.theme-day .text-gray-500,
        body.theme-day .text-gray-400,
        body.theme-day .text-neutral-600,
        body.theme-day .text-neutral-500,
        body.theme-day .text-neutral-400 { color: #5f5a52 !important; }

        body.theme-night .text-slate-900,
        body.theme-night .text-slate-800,
        body.theme-night .text-slate-700,
        body.theme-night .text-gray-900,
        body.theme-night .text-gray-800,
        body.theme-night .text-gray-700,
        body.theme-night .text-neutral-900,
        body.theme-night .text-neutral-800,
        body.theme-night .text-neutral-700 { color: #ffffff !important; }

        body.theme-night .text-slate-600,
        body.theme-night .text-slate-500,
        body.theme-night .text-slate-400,
        body.theme-night .text-slate-300,
        body.theme-night .text-gray-600,
        body.theme-night .text-gray-500,
        body.theme-night .text-gray-400,
        body.theme-night .text-neutral-600,
        body.theme-night .text-neutral-500,
        body.theme-night .text-neutral-400 { color: #d1dbe5 !important; }

        /* Borders */
        body[class*="theme-"] .border,
        body[class*="theme-"] .border-2,
        body[class*="theme-"] .border-slate-100,
        body[class*="theme-"] .border-slate-200,
        body[class*="theme-"] .border-gray-100,
        body[class*="theme-"] .border-gray-200,
        body[class*="theme-"] .border-neutral-100,
        body[class*="theme-"] .border-neutral-200 {
            border-color: var(--border-primary) !important;
        }

        /* Forms */
        body.theme-day input,
        body.theme-day select,
        body.theme-day textarea {
            background-color: #ffffff !important;
            color: #26231f !important;
            border-color: #d8d2c8 !important;
            color-scheme: light;
        }

        body.theme-night input,
        body.theme-night select,
        body.theme-night textarea {
            background-color: #0a1421 !important;
            color: #ffffff !important;
            border-color: #34485d !important;
            color-scheme: dark;
        }

        body.theme-day input::placeholder,
        body.theme-day textarea::placeholder { color: #6d675e !important; opacity: 1 !important; }

        body.theme-night input::placeholder,
        body.theme-night textarea::placeholder { color: #aebdcc !important; opacity: 1 !important; }

        body[class*="theme-"] input:focus,
        body[class*="theme-"] select:focus,
        body[class*="theme-"] textarea:focus {
            border-color: var(--accent) !important;
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent) !important;
        }

        /* Tables */
        body[class*="theme-"] table tbody tr:not(.selected-row) td {
            color: var(--text-primary) !important;
            border-bottom-color: var(--border-primary) !important;
        }
        body.theme-day table tbody tr:nth-child(odd):not(.selected-row) td { background: #faf9f6 !important; }
        body.theme-day table tbody tr:nth-child(even):not(.selected-row) td { background: #f1eee8 !important; }
        body.theme-night table tbody tr:nth-child(odd):not(.selected-row) td { background: #0d1928 !important; }
        body.theme-night table tbody tr:nth-child(even):not(.selected-row) td { background: #111f30 !important; }
        body.theme-day table tbody tr:hover:not(.selected-row) td { background: #e4dfd6 !important; }
        body.theme-night table tbody tr:hover:not(.selected-row) td { background: #17283a !important; }

        /* Labels and controls */
        body[class*="theme-"] label { color: var(--text-secondary) !important; }
        body.theme-day button:disabled,
        body.theme-day input:disabled,
        body.theme-day select:disabled,
        body.theme-day textarea:disabled {
            color: #6d675e !important;
            background-color: #e7edf2 !important;
            border-color: #d8d2c8 !important;
        }
        body.theme-night button:disabled,
        body.theme-night input:disabled,
        body.theme-night select:disabled,
        body.theme-night textarea:disabled {
            color: #aebdcc !important;
            background-color: #101c2b !important;
            border-color: #34485d !important;
        }

        /* Semantic status colors stay distinct from structural theme colors. */
        body.theme-day {
            --status-success-bg: #dcfce7; --status-success-fg: #166534;
            --status-warning-bg: #fef3c7; --status-warning-fg: #92400e;
            --status-danger-bg: #fee2e2; --status-danger-fg: #991b1b;
            --status-info-bg: #dbeafe; --status-info-fg: #1e40af;
            --status-neutral-bg: #e2e8f0; --status-neutral-fg: #334155;
        }
        body.theme-night {
            --status-success-bg: #14532d; --status-success-fg: #bbf7d0;
            --status-warning-bg: #78350f; --status-warning-fg: #fde68a;
            --status-danger-bg: #7f1d1d; --status-danger-fg: #fecaca;
            --status-info-bg: #1e3a8a; --status-info-fg: #bfdbfe;
            --status-neutral-bg: #334155; --status-neutral-fg: #e2e8f0;
        }

        body[class*="theme-"] .bg-green-50, body[class*="theme-"] .bg-green-100,
        body[class*="theme-"] .bg-emerald-50, body[class*="theme-"] .bg-emerald-100 {
            background-color: var(--status-success-bg) !important; color: var(--status-success-fg) !important;
        }
        body[class*="theme-"] .bg-amber-50, body[class*="theme-"] .bg-amber-100,
        body[class*="theme-"] .bg-yellow-50, body[class*="theme-"] .bg-yellow-100 {
            background-color: var(--status-warning-bg) !important; color: var(--status-warning-fg) !important;
        }
        body[class*="theme-"] .bg-red-50, body[class*="theme-"] .bg-red-100,
        body[class*="theme-"] .bg-rose-50, body[class*="theme-"] .bg-rose-100 {
            background-color: var(--status-danger-bg) !important; color: var(--status-danger-fg) !important;
        }
        body[class*="theme-"] .bg-blue-50, body[class*="theme-"] .bg-blue-100,
        body[class*="theme-"] .bg-sky-50, body[class*="theme-"] .bg-sky-100 {
            background-color: var(--status-info-bg) !important; color: var(--status-info-fg) !important;
        }

        /* Structural action colors use the Nile Fleet gold accent. Semantic status
           colors below remain untouched. */
        body.theme-day .bg-blue-500,
        body.theme-day .bg-blue-600,
        body.theme-night .bg-blue-500,
        body.theme-night .bg-blue-600 {
            background-color: var(--accent) !important;
            color: #26231f !important;
        }
        body.theme-day .text-blue-500,
        body.theme-day .text-blue-600,
        body.theme-night .text-blue-500,
        body.theme-night .text-blue-600 { color: var(--accent) !important; }

        body.theme-day .bg-sky-500,
        body.theme-day .bg-sky-600,
        body.theme-night .bg-sky-500,
        body.theme-night .bg-sky-600,
        body.theme-day .bg-cyan-500,
        body.theme-day .bg-cyan-600,
        body.theme-night .bg-cyan-500,
        body.theme-night .bg-cyan-600 {
            background-color: var(--accent) !important;
            color: #26231f !important;
        }

        /* SYSTEM-WIDE DAY-MODE CONTRAST GUARD
           Prevent white foregrounds from disappearing on light surfaces. */
        body.theme-day .bg-white [class*="text-white"],
        body.theme-day .bg-slate-50 [class*="text-white"],
        body.theme-day .bg-slate-100 [class*="text-white"],
        body.theme-day .bg-gray-50 [class*="text-white"],
        body.theme-day .bg-gray-100 [class*="text-white"],
        body.theme-day .bg-neutral-50 [class*="text-white"],
        body.theme-day .bg-neutral-100 [class*="text-white"],
        body.theme-day [style*="background-color: #fff"] [class*="text-white"],
        body.theme-day [style*="background-color: rgb(255, 255, 255)"] [class*="text-white"] {
            color: var(--text-primary) !important;
        }

        body.theme-day .bg-white[class*="text-white"],
        body.theme-day .bg-slate-50[class*="text-white"],
        body.theme-day .bg-slate-100[class*="text-white"],
        body.theme-day .bg-gray-50[class*="text-white"],
        body.theme-day .bg-gray-100[class*="text-white"],
        body.theme-day .bg-neutral-50[class*="text-white"],
        body.theme-day .bg-neutral-100[class*="text-white"] {
            color: var(--text-primary) !important;
        }

        /* Common light cards with inherited white/opacity text. */
        body.theme-day .bg-white .text-white\/90,
        body.theme-day .bg-white .text-white\/80,
        body.theme-day .bg-white .text-white\/75,
        body.theme-day .bg-white .text-white\/70,
        body.theme-day .bg-white .text-white\/60,
        body.theme-day .bg-white .text-white\/50,
        body.theme-day .bg-white .text-white\/40,
        body.theme-day .bg-white .text-white\/30 {
            color: var(--text-secondary) !important;
        }

        /* Native form controls must remain readable in Day mode even when a
           component accidentally carries a white text utility. */
        body.theme-day input[class*="text-white"],
        body.theme-day select[class*="text-white"],
        body.theme-day textarea[class*="text-white"] {
            color: var(--text-primary) !important;
        }

        /* Preserve intentional white text; Day surfaces define their own readable foreground. */

        /* Arabic shaping — connected letters must remain naturally joined. */
        [dir="rtl"] *,
        [lang="ar"] * {
            letter-spacing: normal !important;
            word-spacing: normal !important;
            text-transform: none;
        }
        [dir="rtl"] [class*="tracking-"],
        [lang="ar"] [class*="tracking-"] {
            letter-spacing: normal !important;
        }

        @media (max-width: 1023px) {
            main { padding-bottom: 76px; }
        }
        /* Mobile Genset readability: prevent compressed labels and stacked text */
        /* Production responsive system: mobile is a deliberate layout, not a scaled desktop. */
        html, body, #root { max-width: 100%; }
        html, body { overflow-x: clip; }
        img, svg, video, canvas { max-width: 100%; }
        button, input, select, textarea { touch-action: manipulation; }
        button, [role="button"], a { min-height: 44px; }
        input, select, textarea { min-height: 44px; }
        .nile-fleet-layout { min-width: 0; width: 100%; }
        .nile-fleet-layout main { min-width: 0; }
        .nile-fleet-layout table { max-width: 100%; }
        .nile-fleet-layout .overflow-x-auto { max-width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .nf-mobile-card-grid { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: .75rem; }

        @media (max-width: 1023px) {
            main { padding-bottom: env(safe-area-inset-bottom); }
            .nile-fleet-layout { padding-top: env(safe-area-inset-top); }
        }

        @media (max-width: 767px) {
            .nile-fleet-layout main {
                width: 100%;
                min-width: 0;
                overflow-x: clip;
            }
            .nile-fleet-layout main > * { min-width: 0; max-width: 100%; }
            .nile-fleet-layout main .grid > *, .nile-fleet-layout main .flex > * { min-width: 0; }
            .nile-fleet-layout main h1, .nile-fleet-layout main h2, .nile-fleet-layout main h3,
            .nile-fleet-layout main h4, .nile-fleet-layout main h5, .nile-fleet-layout main h6,
            .nile-fleet-layout main p, .nile-fleet-layout main label { max-width: 100%; overflow-wrap: anywhere; word-break: normal; }
            .nile-fleet-layout main button { min-width: 44px; max-width: 100%; }
            .nile-fleet-layout main input, .nile-fleet-layout main select, .nile-fleet-layout main textarea { min-width: 0; max-width: 100%; }
            .nile-fleet-layout main table { width: max-content; min-width: 100%; white-space: nowrap; }
            .nile-fleet-layout main .overflow-x-auto { max-width: 100%; overflow-x: auto; }
            .nile-fleet-layout main .flex.items-center.justify-between,
            .nile-fleet-layout main .flex.items-end.justify-between { flex-wrap: wrap; row-gap: .75rem; }
            .nile-fleet-layout main [class*="rounded-[3.5rem]"],
            .nile-fleet-layout main [class*="rounded-[3rem]"] { border-radius: 1.25rem; }
            .nile-fleet-layout main [class*="p-8"] { padding: 1.25rem; }
            .nile-fleet-layout main [class*="p-10"] { padding: 1.25rem; }
            .nile-fleet-layout main [class*="gap-8"] { gap: 1rem; }
            .nile-fleet-layout main [class*="gap-10"] { gap: 1rem; }
            .nile-fleet-layout main [class*="min-w-["] { min-width: 0 !important; }
            .nf-mobile-full { width: 100% !important; }
        }

        @media (max-width: 430px) {
            .nile-fleet-layout main { padding-left: .75rem; padding-right: .75rem; }
            .nile-fleet-layout main .text-2xl { font-size: 1.35rem; line-height: 1.2; }
            .nile-fleet-layout main .text-3xl { font-size: 1.55rem; line-height: 1.2; }
        }

        @media (max-width: 374px) {
            .nile-fleet-layout main { padding-left: .625rem; padding-right: .625rem; }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .nile-fleet-layout main { padding-left: 1rem; padding-right: 1rem; }
        }


        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        #root:empty {
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background: var(--bg-primary); color: var(--accent); font-weight: bold; font-size: 14px;
            text-transform: uppercase; letter-spacing: 0.2em;
        }


        /* NILE FLEET GLOBAL COLOR SYSTEM V2 */
        /* One consistent industrial palette. Semantic operational colors remain
           intentionally distinct so status meaning is never lost. */
        body.theme-day {
            --nf-navy: #17324d;
            --nf-navy-deep: #10263b;
            --nf-steel: #36566f;
            --nf-surface: #f5f7f9;
            --nf-surface-2: #e9eef3;
            --nf-surface-3: #dce5ec;
            --nf-text: #17212b;
            --nf-muted: #526170;
            --nf-border: #c5d0da;
            --nf-gold: #b8832f;
            --nf-gold-dark: #8a611f;
            --nf-blue: #2563eb;
        }
        body.theme-night {
            --nf-navy: #18324b;
