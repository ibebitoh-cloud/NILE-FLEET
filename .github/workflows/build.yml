name: NILE 1 Build Check

on:
  push:
    branches:
      - nile-1-v2-fixes
  pull_request:
    branches:
      - nile-1-v2-fixes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
